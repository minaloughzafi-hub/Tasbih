<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="تسبيح">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>تسبيح</title>
<style>
:root{--u:min(1vw,.5625vh)}
html,body{height:100%;margin:0;background:#fff;overflow:hidden}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic","Noto Naskh Arabic",sans-serif}
.app{position:fixed;top:0;bottom:0;left:50%;width:calc(var(--u)*100);margin-left:calc(var(--u)*-50);overflow:hidden;background:#fff}
.top{position:absolute;left:20%;width:60%;top:calc(4% + env(safe-area-inset-top,0px));height:15%;border-radius:999px;background:#353735;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:500;font-variant-numeric:tabular-nums}
.c{position:absolute;width:calc(var(--u)*22);height:calc(var(--u)*22);margin:calc(var(--u)*-11) 0 0 calc(var(--u)*-11);border:0;padding:0;border-radius:50%;background:#353735;color:#fff;font:inherit;font-size:calc(var(--u)*7.5);font-weight:500;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;transition:background .2s}
.c.on{background:#e53935}
.c.free{font-size:calc(var(--u)*9)}
.c.k{font-size:calc(var(--u)*6.6)}
.big{position:absolute;left:50%;top:60%;width:calc(var(--u)*141.5);height:calc(var(--u)*141.5);margin-left:calc(var(--u)*-70.75);border:0;padding:0;border-radius:50%;background:#ffa400;cursor:pointer;touch-action:manipulation;transition:background .5s}
.big:active{filter:brightness(.94)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><span id="num">33</span></div>
  <button class="c" data-v="100" style="left:20.3%;top:34%">100</button>
  <button class="c" data-v="70" style="left:49.9%;top:33.4%">70</button>
  <button class="c" data-v="33" style="left:80.2%;top:32.7%">33</button>
  <button class="c free" data-v="free" style="left:33.2%;top:47.2%">حر</button>
  <button class="c k" data-v="1000" style="left:66.9%;top:46.6%">1000</button>
  <button class="big" id="big" type="button" aria-label="سبّح"></button>
</div>
<script>
var OPTS=['100','70','33','1000','free'];
var SEL='33',n=33,c=0,color='#ffa400',lastH=35,ctx=null,zeroT=null;
function $(id){return document.getElementById(id)}
try{
  var s=JSON.parse(localStorage.getItem('tasbih2-v1'));
  if(s&&OPTS.indexOf(s.sel)>-1){
    SEL=s.sel;c=s.c>0?s.c|0:0;n=s.n|0;
    if(SEL!=='free'&&!(n>=1&&n<=+SEL))n=+SEL;
    if(typeof s.color==='string'&&/^hsl\(|^#[0-9a-f]{6}$/i.test(s.color))color=s.color;
  }
}catch(e){}
function save(){try{localStorage.setItem('tasbih2-v1',JSON.stringify({sel:SEL,n:n,c:c,color:color}))}catch(e){}}
function show(v){
  var t=$('num');t.textContent=v;
  t.style.fontSize='calc(var(--u)*'+(String(v).length>=5?10:14)+')';
}
function render(){
  show(SEL==='free'?c:n);
  var b=document.querySelectorAll('.c');
  for(var k=0;k<b.length;k++)b[k].classList.toggle('on',b[k].getAttribute('data-v')===SEL);
  $('big').style.background=color;
}
function unlock(){
  try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}catch(e){}
}
function beep(){
  try{
    unlock();
    [880,1175].forEach(function(f,k){
      var o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+k*.16;
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.1,t+.02);g.gain.exponentialRampToValueAtTime(0.0001,t+.28);
      o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.3);
    });
  }catch(e){}
}
function randColor(){
  var h,tries=0;
  do{h=Math.floor(Math.random()*360);tries++}while(tries<20&&Math.min(Math.abs(h-lastH),360-Math.abs(h-lastH))<60);
  lastH=h;
  return 'hsl('+h+',80%,50%)';
}
function choose(v){
  SEL=v;clearTimeout(zeroT);
  if(v==='free')c=0;else n=+v;
  render();save();unlock();
}
function tap(){
  unlock();
  if(SEL==='free'){c++;render();save();return}
  n--;
  if(n<=0){
    beep();try{navigator.vibrate&&navigator.vibrate([80,60,80])}catch(e){}
    color=randColor();n=+SEL;
    $('big').style.background=color;
    show(0);clearTimeout(zeroT);zeroT=setTimeout(render,500);
    save();
  }else{render();save()}
}
$('big').addEventListener('pointerdown',function(e){e.preventDefault();tap()});
$('big').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();tap()}});
var cs=document.querySelectorAll('.c');
for(var k=0;k<cs.length;k++){(function(el){
  el.addEventListener('pointerdown',function(e){e.preventDefault();choose(el.getAttribute('data-v'))});
  el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(el.getAttribute('data-v'))}});
})(cs[k])}
render();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
